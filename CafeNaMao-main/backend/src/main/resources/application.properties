spring.application.name=cafe-na-mao-api

# Banco H2 em arquivo: os dados sobrevivem ao reinício da API.
# O caminho é relativo ao diretório de execução (em container, /app/data).
spring.datasource.url=jdbc:h2:file:./data/cafe-na-mao;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# O schema é criado e versionado pelo Flyway; o Hibernate apenas valida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
